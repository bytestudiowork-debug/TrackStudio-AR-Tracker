name: Basalt Android arm64 build spike

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "third_party/basalt-android/**"
      - "third_party/basalt"
      - ".github/workflows/basalt-android-arm64.yml"

permissions:
  contents: read

jobs:
  build-basalt-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout Basalt and its pinned dependency submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses

      - name: Install pinned Android NDK and Ninja
        run: |
          SDKMANAGER="$(command -v sdkmanager)"
          "$SDKMANAGER" "ndk;27.0.12077973"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure build tools
        run: |
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/third_party/basalt/thirdparty/vcpkg" >> "$GITHUB_ENV"
          cmake --version
          ninja --version

      - name: Bootstrap pinned vcpkg
        run: ./third_party/basalt/thirdparty/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Fetch full vcpkg history for versioned port trees
        run: |
          git -C "$VCPKG_ROOT" fetch --unshallow origin master
          git -C "$VCPKG_ROOT" cat-file -e 05442024c3fda64320bd25d2251cc9807b84fb6f^{commit}

      - name: Create version-pinned OpenCV overlay with KleidiCV disabled
        run: |
          set -euo pipefail
          # The manifest baseline resolves OpenCV 4.12.0#1 to this exact vcpkg port tree.
          # Patch that versioned tree, not the unrelated top-level ports/opencv4 checkout.
          OPENCV_PORT_TREE="e911d4fa082b6d5a45197b6c6abe1d232b1fe90f"
          OVERLAY_PORT="$GITHUB_WORKSPACE/build/vcpkg-overlay-ports/opencv4"
          mkdir -p "$OVERLAY_PORT"
          git -C "$VCPKG_ROOT" archive "$OPENCV_PORT_TREE" | tar -x -C "$OVERLAY_PORT"
          PORTFILE="$OVERLAY_PORT/portfile.cmake"
          grep -q -- '-DWITH_CPUFEATURES=${WITH_CPUFEATURES}' "$PORTFILE"
          if ! grep -q -- '-DWITH_KLEIDICV=OFF' "$PORTFILE"; then
            sed -i '/-DWITH_CPUFEATURES=${WITH_CPUFEATURES}/a\        -DWITH_KLEIDICV=OFF' "$PORTFILE"
          fi
          grep -n -- '-DWITH_KLEIDICV=OFF' "$PORTFILE"
          test -f "$OVERLAY_PORT/vcpkg.json"


      - name: Install Android arm64 Basalt dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet arm64-android \
            --overlay-triplets="$GITHUB_WORKSPACE/third_party/basalt-android/vcpkg-triplets" \
            --overlay-ports="$GITHUB_WORKSPACE/build/vcpkg-overlay-ports" \
            --host-triplet x64-linux \
            --x-manifest-root="$GITHUB_WORKSPACE/third_party/basalt-android" \
            --x-install-root="$GITHUB_WORKSPACE/build/basalt-vcpkg-installed"

      - name: Configure untouched Basalt source for Android
        run: |
          cmake -S third_party/basalt-android -B build/basalt-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/third_party/basalt-android/cmake/android-toolchain-policy.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/basalt-vcpkg-installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build upstream Basalt shared library only
        run: cmake --build build/basalt-android-arm64 --target basalt --parallel 2

      - name: Verify arm64 output and collect minimal runtime closure
        run: |
          set -euo pipefail
          LIB="$(find build/basalt-android-arm64 -type f -name 'libbasalt.so' -print -quit)"
          test -n "$LIB"
          LLVM_READelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$LLVM_READelf" -h "$LIB" | grep -q "AArch64"
          LIBCXX="$(find "$ANDROID_NDK_HOME" -type f -name 'libc++_shared.so' | grep -E '/(aarch64-linux-android|arm64-v8a)/libc\+\+_shared\.so$' | head -n1)"
          test -n "$LIBCXX"
          mkdir -p basalt-android-arm64-artifact
          cp "$LIB" basalt-android-arm64-artifact/
          cp "$LIBCXX" basalt-android-arm64-artifact/
          python3 - "$LLVM_READelf" "$LIB" "$GITHUB_WORKSPACE/build/basalt-vcpkg-installed/arm64-android" "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" basalt-android-arm64-artifact <<'PY'
          import pathlib
          import re
          import shutil
          import subprocess
          import sys

          readelf, root_lib, vcpkg_root, ndk_sysroot, output = sys.argv[1:]
          root_lib = pathlib.Path(root_lib)
          vcpkg_root = pathlib.Path(vcpkg_root)
          ndk_sysroot = pathlib.Path(ndk_sysroot)
          output = pathlib.Path(output)
          copied = {root_lib.name}
          pending = [root_lib]
          needed_re = re.compile(r"\(NEEDED\).*Shared library: \[(.+?)\]")

          def needed(path):
              result = subprocess.check_output([readelf, "-d", str(path)], text=True)
              return needed_re.findall(result)

          while pending:
              current = pending.pop()
              for soname in needed(current):
                  if soname in copied:
                      continue
                  candidates = list(vcpkg_root.rglob(soname))
                  if candidates:
                      candidates.sort(key=lambda p: ("/debug/" in p.as_posix(), len(p.as_posix())))
                      source = candidates[0]
                      destination = output / soname
                      shutil.copy2(source, destination)
                      copied.add(soname)
                      pending.append(destination)
                      print(f"Bundled vcpkg runtime: {soname}")
                      continue

                  system_matches = list(ndk_sysroot.rglob(soname))
                  if system_matches:
                      print(f"Android system library (not bundled): {soname}")
                      continue

                  raise SystemExit(f"Unresolved ELF dependency {soname} required by {current}")

          print("Runtime bundle:", ", ".join(sorted(copied)))
          PY
          printf '%s\n' "0f3b2b52c807f70ff4e2973ce253c73329eea7bc" > basalt-android-arm64-artifact/BASALT_COMMIT.txt
          "$LLVM_READelf" -d "$LIB" > basalt-android-arm64-artifact/dynamic-dependencies.txt

      - name: Upload isolated Basalt arm64 build
        uses: actions/upload-artifact@v4
        with:
          name: basalt-android-arm64-spike
          path: basalt-android-arm64-artifact/
          if-no-files-found: error
          retention-days: 14

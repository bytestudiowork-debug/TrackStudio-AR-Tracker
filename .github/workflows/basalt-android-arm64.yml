name: Basalt Android arm64 build spike

on:
  # This is an expensive native dependency build. Start it manually only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-basalt-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout Basalt and its pinned dependency submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses

      - name: Install pinned Android NDK and Ninja
        run: |
          SDKMANAGER="$(command -v sdkmanager)"
          "$SDKMANAGER" "ndk;27.0.12077973"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure build tools
        run: |
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/third_party/basalt/thirdparty/vcpkg" >> "$GITHUB_ENV"
          cmake --version
          ninja --version

      - name: Bootstrap pinned vcpkg
        run: ./third_party/basalt/thirdparty/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Fetch full vcpkg history for versioned port trees
        run: |
          git -C "$VCPKG_ROOT" fetch --unshallow origin master
          git -C "$VCPKG_ROOT" cat-file -e 05442024c3fda64320bd25d2251cc9807b84fb6f^{commit}

      - name: Create version-pinned OpenCV overlay with KleidiCV disabled
        run: |
          set -euo pipefail
          # The manifest baseline resolves OpenCV 4.12.0#1 to this exact vcpkg port tree.
          # Patch that versioned tree, not the unrelated top-level ports/opencv4 checkout.
          OPENCV_PORT_TREE="e911d4fa082b6d5a45197b6c6abe1d232b1fe90f"
          OVERLAY_PORT="$GITHUB_WORKSPACE/build/vcpkg-overlay-ports/opencv4"
          mkdir -p "$OVERLAY_PORT"
          git -C "$VCPKG_ROOT" archive "$OPENCV_PORT_TREE" | tar -x -C "$OVERLAY_PORT"
          PORTFILE="$OVERLAY_PORT/portfile.cmake"
          grep -q -- '-DWITH_CPUFEATURES=${WITH_CPUFEATURES}' "$PORTFILE"
          if ! grep -q -- '-DWITH_KLEIDICV=OFF' "$PORTFILE"; then
            sed -i '/-DWITH_CPUFEATURES=${WITH_CPUFEATURES}/a\\        -DWITH_KLEIDICV=OFF' "$PORTFILE"
          fi
          grep -n -- '-DWITH_KLEIDICV=OFF' "$PORTFILE"
          test -f "$OVERLAY_PORT/vcpkg.json"

      - name: Restore vcpkg dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            build/basalt-vcpkg-installed
            build/basalt-android-arm64
          key: vcpkg-arm64-android-${{ runner.os }}-${{ hashFiles('third_party/basalt-android/CMakeLists.txt', 'third_party/basalt-android/vcpkg.json', 'third_party/basalt-android/vcpkg-triplets/**', 'third_party/basalt-android/cmake/**', 'third_party/basalt/src/**', 'third_party/basalt/include/**', 'third_party/basalt/thirdparty/vcpkg/versions/baseline.json') }}-basalt-0f3b2b5-ndk27-opencv-kleidicv-off-v3
          restore-keys: |
            vcpkg-arm64-android-${{ runner.os }}-

      - name: Install Android arm64 Basalt dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet arm64-android \
            --overlay-triplets="$GITHUB_WORKSPACE/third_party/basalt-android/vcpkg-triplets" \
            --overlay-ports="$GITHUB_WORKSPACE/build/vcpkg-overlay-ports" \
            --host-triplet x64-linux \
            --x-manifest-root="$GITHUB_WORKSPACE/third_party/basalt-android" \
            --x-install-root="$GITHUB_WORKSPACE/build/basalt-vcpkg-installed"

      - name: Configure minimal Basalt VIO core for Android
        run: |
          cmake -S third_party/basalt-android -B build/basalt-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/third_party/basalt-android/cmake/android-toolchain-policy.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/basalt-vcpkg-installed" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build Android Basalt VIO core shared library only
        run: cmake --build build/basalt-android-arm64 --target basalt --parallel 2

      - name: Verify arm64 output and collect minimal runtime closure
        shell: bash
        run: |
          set -euo pipefail
          LLVM_READelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          python3 - "$LLVM_READelf" "$GITHUB_WORKSPACE/build/basalt-android-arm64" "$GITHUB_WORKSPACE/build/basalt-vcpkg-installed/arm64-android" "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" "$GITHUB_WORKSPACE" <<'PY'
          import pathlib
          import re
          import shutil
          import subprocess
          import sys

          readelf, build_root, vcpkg_root, ndk_sysroot, workspace = sys.argv[1:]
          build_root = pathlib.Path(build_root)
          vcpkg_root = pathlib.Path(vcpkg_root)
          ndk_sysroot = pathlib.Path(ndk_sysroot)
          workspace = pathlib.Path(workspace)
          output = workspace / "basalt-android-arm64-artifact"
          output.mkdir(parents=True, exist_ok=True)

          def fail(message):
              print(f"ERROR: {message}", file=sys.stderr, flush=True)
              raise SystemExit(1)

          libraries = sorted(build_root.rglob("libbasalt.so"))
          if not libraries:
              fail(f"libbasalt.so was not found under {build_root}")
          root_lib = libraries[0]

          header = subprocess.run(
              [readelf, "-h", str(root_lib)],
              check=True, capture_output=True, text=True
          ).stdout
          if "AArch64" not in header:
              fail(f"{root_lib} is not an AArch64 ELF library")

          libcxx_candidates = [
              path for path in ndk_sysroot.rglob("libc++_shared.so")
              if "aarch64-linux-android" in path.parts or "arm64-v8a" in path.parts
          ]
          if not libcxx_candidates:
              fail(f"Could not locate arm64 libc++_shared.so under {ndk_sysroot}")
          libcxx_candidates.sort(key=lambda path: (len(path.parts), path.as_posix()))
          libcxx = libcxx_candidates[0]

          shutil.copy2(root_lib, output / root_lib.name)
          shutil.copy2(libcxx, output / libcxx.name)
          print(f"Verified AArch64 library: {root_lib}", flush=True)
          print(f"Bundled Android C++ runtime: {libcxx}", flush=True)

          needed_re = re.compile(r"\(NEEDED\).*Shared library: \[(.+?)\]")

          def needed(path):
              result = subprocess.run(
                  [readelf, "-d", str(path)],
                  check=True, capture_output=True, text=True
              )
              return needed_re.findall(result.stdout)

          system_names = {
              path.name for path in ndk_sysroot.rglob("*.so")
              if "aarch64-linux-android" in path.parts or "arm64-v8a" in path.parts
          }
          copied = {root_lib.name, libcxx.name}
          pending = [root_lib, libcxx]

          while pending:
              current = pending.pop()
              for soname in needed(current):
                  if soname in copied:
                      continue

                  candidates = [
                      path for path in vcpkg_root.rglob(soname)
                      if path.is_file() and "/debug/" not in path.as_posix()
                  ]
                  if candidates:
                      candidates.sort(key=lambda path: (len(path.as_posix()), path.as_posix()))
                      source = candidates[0]
                      destination = output / soname
                      shutil.copy2(source, destination)
                      copied.add(soname)
                      pending.append(destination)
                      print(f"Bundled vcpkg runtime: {soname} from {source}", flush=True)
                      continue

                  if soname in system_names:
                      print(f"Android arm64 system library: {soname}", flush=True)
                      continue

                  fail(
                      f"Unresolved ELF dependency '{soname}' required by '{current}'. "
                      f"Searched vcpkg target tree '{vcpkg_root}' and Android arm64 sysroot '{ndk_sysroot}'."
                  )

          (output / "BASALT_COMMIT.txt").write_text(
              "0f3b2b52c807f70ff4e2973ce253c73329eea7bc\n",
              encoding="utf-8"
          )
          dynamic = subprocess.run(
              [readelf, "-d", str(root_lib)],
              check=True, capture_output=True, text=True
          ).stdout
          (output / "dynamic-dependencies.txt").write_text(dynamic, encoding="utf-8")
          print("Runtime bundle: " + ", ".join(sorted(copied)), flush=True)
          PY

      - name: Upload isolated Basalt arm64 build
        uses: actions/upload-artifact@v4
        with:
          name: basalt-android-arm64-spike
          path: basalt-android-arm64-artifact/
          if-no-files-found: error
          retention-days: 14
